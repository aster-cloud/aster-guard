name: Image

# aster-guard-mcp 与演示 HTTP 工具的镜像（aster-api ADR 0054 §12 D5）：main 上每次推送构建 linux/arm64 镜像、
# 校验确为 arm64、cosign keyless 签名并验签，再经 image-pin App 向 wontlost-ltd/k3s 开 pin PR。
# ★没有 pull_request 触发：签名身份 = main 上的本工作流，k3s 的 policy-controller 只接受这个身份；
#   PR 无从产出被集群接受的镜像（test/workflow-image.test.ts 断言）。
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    # workflow_dispatch 只在 main 上有意义：签名身份带 ref，其它 ref 的签名不会被集群接受。
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # cosign keyless：OIDC token 把签名绑定到 aster-cloud/aster-guard 的本工作流 @ main。
      id-token: write
    outputs:
      stale: ${{ steps.staleguard.outputs.stale }}
      mcp_digest: ${{ steps.build-mcp.outputs.digest }}
      tool_digest: ${{ steps.build-tool.outputs.digest }}
    steps:
      - uses: actions/checkout@v6

      # Stale-commit guard（同 aster-ai-workspace deploy.yml）：构建期间 main 已前进则不推镜像，
      # 交给更新提交的运行，避免旧镜像被签名后 pin 到集群。
      - name: Stale-commit guard
        id: staleguard
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ github.event_name }}" != "push" ]; then
            echo "stale=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          tip="$(gh api "repos/${{ github.repository }}/commits/main" --jq .sha || true)"
          echo "this run: ${GITHUB_SHA}  origin/main tip: ${tip}"
          if [ -z "${tip}" ] || [ "${GITHUB_SHA}" != "${tip}" ]; then
            echo "::warning::本次 ${GITHUB_SHA} 已非 main tip（${tip:-无法解析}），跳过推送与签名。"
            echo "stale=true" >> "$GITHUB_OUTPUT"
          else
            echo "stale=false" >> "$GITHUB_OUTPUT"
          fi

      - if: ${{ steps.staleguard.outputs.stale != 'true' }}
        uses: docker/setup-qemu-action@v4

      - if: ${{ steps.staleguard.outputs.stale != 'true' }}
        uses: docker/setup-buildx-action@v4

      - if: ${{ steps.staleguard.outputs.stale != 'true' }}
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build & push aster-guard-mcp
        id: build-mcp
        if: ${{ steps.staleguard.outputs.stale != 'true' }}
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/mcp.Dockerfile
          platforms: linux/arm64
          push: true
          pull: true
          # 去掉 unknown/unknown 的 attestation 条目；架构由下面的 uname 校验保证。
          provenance: false
          sbom: false
          tags: docker.io/wontlost/aster-guard-mcp:${{ github.sha }}

      - name: Build & push aster-guard-demo-tool
        id: build-tool
        if: ${{ steps.staleguard.outputs.stale != 'true' }}
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/demo-tool.Dockerfile
          platforms: linux/arm64
          push: true
          pull: true
          provenance: false
          sbom: false
          tags: docker.io/wontlost/aster-guard-demo-tool:${{ github.sha }}

      # ★arm64 内容校验（同 aster-api deploy.yml 的教训）：QEMU 跨构建曾产出「标 arm64、内容 amd64」的镜像，
      #   节点上 exec format error。按 digest 拉 arm64 变体，在镜像内 uname -m 必须是 aarch64。
      #   镜像入口是 node，故以 --entrypoint uname 运行（不依赖 shell）。
      - name: Verify aster-guard-mcp is genuinely arm64
        if: ${{ steps.staleguard.outputs.stale != 'true' }}
        env:
          IMAGE: docker.io/wontlost/aster-guard-mcp
          DIGEST: ${{ steps.build-mcp.outputs.digest }}
        run: &verify-arch |
          set -euo pipefail
          test -n "${DIGEST}" || { echo "::error::build 未输出 digest"; exit 1; }
          docker pull -q --platform linux/arm64 alpine:3 >/dev/null
          pre="$(docker run --rm --platform linux/arm64 alpine:3 uname -m 2>/dev/null | tail -n1 | tr -d '[:space:]')"
          [ "${pre}" = aarch64 ] || { echo "::error::runner 无法模拟 arm64（alpine uname='${pre}'），CI 环境问题"; exit 1; }
          docker pull -q --platform linux/arm64 "${IMAGE}@${DIGEST}" >/dev/null
          arch="$(docker run --rm --platform linux/arm64 --entrypoint uname "${IMAGE}@${DIGEST}" -m 2>/dev/null | tail -n1 | tr -d '[:space:]')"
          echo "${IMAGE}@${DIGEST}: uname -m = '${arch}'"
          [ "${arch}" = aarch64 ] || { echo "::error::镜像标 arm64 但内容是 '${arch}'，禁止签名"; exit 1; }

      - name: Verify aster-guard-demo-tool is genuinely arm64
        if: ${{ steps.staleguard.outputs.stale != 'true' }}
        env:
          IMAGE: docker.io/wontlost/aster-guard-demo-tool
          DIGEST: ${{ steps.build-tool.outputs.digest }}
        run: *verify-arch

      - name: Install cosign
        if: ${{ steps.staleguard.outputs.stale != 'true' }}
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          # 固定 cosign v2.5.2：installer v4 缺省 v3（新 bundle 格式），集群 policy-controller 只验证过 v2 attached 签名。
          cosign-release: 'v2.5.2'

      - name: Sign aster-guard-mcp digest (keyless)
        if: ${{ steps.staleguard.outputs.stale != 'true' }}
        env:
          COSIGN_YES: 'true'
          IMAGE: docker.io/wontlost/aster-guard-mcp
          DIGEST: ${{ steps.build-mcp.outputs.digest }}
        run: &sign |
          set -euo pipefail
          test -n "${DIGEST}" || { echo "::error::build 未输出 digest"; exit 1; }
          cosign sign "${IMAGE}@${DIGEST}"

      - name: Sign aster-guard-demo-tool digest (keyless)
        if: ${{ steps.staleguard.outputs.stale != 'true' }}
        env:
          COSIGN_YES: 'true'
          IMAGE: docker.io/wontlost/aster-guard-demo-tool
          DIGEST: ${{ steps.build-tool.outputs.digest }}
        run: *sign

      # 验签身份逐字等于 k3s ClusterImagePolicy 中的 subject（ADR 0054 §12 D5），fail-closed。
      - name: Verify aster-guard-mcp signature
        if: ${{ steps.staleguard.outputs.stale != 'true' }}
        env:
          IMAGE: docker.io/wontlost/aster-guard-mcp
          DIGEST: ${{ steps.build-mcp.outputs.digest }}
        run: &verify-sig |
          cosign verify "${IMAGE}@${DIGEST}" \
            --certificate-identity "https://github.com/aster-cloud/aster-guard/.github/workflows/image.yml@refs/heads/main" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" >/dev/null
          echo "verified ${IMAGE}@${DIGEST}"

      - name: Verify aster-guard-demo-tool signature
        if: ${{ steps.staleguard.outputs.stale != 'true' }}
        env:
          IMAGE: docker.io/wontlost/aster-guard-demo-tool
          DIGEST: ${{ steps.build-tool.outputs.digest }}
        run: *verify-sig

  # 经 image-pin App（id 4253193）向 k3s 开 pin PR；脚本等 k3s 的 verify-image-pin 通过后自行合并。
  # 新鲜度：本 job 的 Final stale gate 只是减少噪音；真正的闸在 k3s——verify-image-pin 规则 3（freshness
  # latest-only）对每次 head 要求 sourceSha == 本仓 main 当前 HEAD，否则拒绝；合并用 --match-head-commit
  # 锁定已验证的 head。main 前进后更新的运行会强推同一固定分支，旧 digest 的 head 随之作废。
  # 剩余窗口（验证通过后、合并前 main 恰好前进）与所有源仓共用同一脚本，修正应在上游统一做。
  # 前置（用户，U-G2）：Environment image-pin（部署分支仅 main）内 vars.IMAGE_PIN_APP_CLIENT_ID 与
  # secrets.IMAGE_PIN_APP_PRIVATE_KEY。k3s 侧尚无对应 lock / 信任根时 verify-image-pin 拒绝、本 job 红（预期）。
  image-pin-pr:
    needs: build
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.build.outputs.stale != 'true' && vars.IMAGE_PIN_APP_CLIENT_ID != '' }}
    runs-on: ubuntu-latest
    environment: image-pin
    outputs:
      pinned: ${{ steps.openpr-mcp.outcome == 'success' && steps.openpr-tool.outcome == 'success' }}
      final_stale: ${{ steps.stalegate.outputs.skip }}
    concurrency:
      group: image-pin-pr-aster-guard
      cancel-in-progress: true
    steps:
      - name: Final stale gate
        id: stalegate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tip="$(gh api "repos/${{ github.repository }}/commits/main" --jq .sha)"
          echo "this run: ${GITHUB_SHA}  origin/main tip: ${tip}"
          if [ "${GITHUB_SHA}" != "${tip}" ]; then
            echo "::notice::main 已前进，本 run 过时 → 跳过 image-pin PR"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Mint k3s-scoped token
        if: ${{ steps.stalegate.outputs.skip != 'true' }}
        id: k3stoken
        uses: actions/create-github-app-token@v3.2.0
        with:
          client-id: ${{ vars.IMAGE_PIN_APP_CLIENT_ID }}
          private-key: ${{ secrets.IMAGE_PIN_APP_PRIVATE_KEY }}
          owner: wontlost-ltd
          repositories: k3s
          permission-contents: write
          permission-pull-requests: write
          permission-checks: read

      - name: Checkout (for shared script)
        if: ${{ steps.stalegate.outputs.skip != 'true' }}
        uses: actions/checkout@v6

      - name: Open/update image-pin PR (aster-guard-mcp)
        id: openpr-mcp
        if: ${{ steps.stalegate.outputs.skip != 'true' }}
        env:
          GH_TOKEN: ${{ steps.k3stoken.outputs.token }}
          DIGEST: ${{ needs.build.outputs.mcp_digest }}
          SOURCE_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          LOCK_PATH: apps/aster-lang/guard/image-lock.yaml
          KUSTOMIZATION_PATH: apps/aster-lang/guard/kustomization.yaml
        run: bash scripts/ci/open-image-pin-pr.sh docker.io/wontlost/aster-guard-mcp image-pin/aster-guard-mcp

      - name: Open/update image-pin PR (aster-guard-demo-tool)
        id: openpr-tool
        if: ${{ steps.stalegate.outputs.skip != 'true' }}
        env:
          GH_TOKEN: ${{ steps.k3stoken.outputs.token }}
          DIGEST: ${{ needs.build.outputs.tool_digest }}
          SOURCE_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          LOCK_PATH: apps/aster-lang/tools/image-lock.yaml
          KUSTOMIZATION_PATH: apps/aster-lang/tools/kustomization.yaml
        run: bash scripts/ci/open-image-pin-pr.sh docker.io/wontlost/aster-guard-demo-tool image-pin/aster-guard-demo-tool

  # 部署闭环自检：该 pin 而没 pin（两个镜像任一未开出 PR）⇒ 显式失败。判定逻辑与测试同 aster-ai-workspace。
  pin-closure-guard:
    needs: [build, image-pin-pr]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: scripts/ci
      - name: 断言「该 pin 则已 pin」
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          TRAIN_ID: ''
          STALE: ${{ needs.build.outputs.stale }}
          CLIENT_ID: ${{ vars.IMAGE_PIN_APP_CLIENT_ID }}
          DEPLOY_RESULT: ${{ needs.build.result }}
          PIN_RESULT: ${{ needs.image-pin-pr.result }}
          PINNED: ${{ needs.image-pin-pr.outputs.pinned }}
          FINAL_STALE: ${{ needs.image-pin-pr.outputs.final_stale }}
        run: bash scripts/ci/pin-closure-guard.sh
